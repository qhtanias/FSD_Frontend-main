<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <!-- Bootstrap CSS (needed for btn/badge classes to render) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">
</head>
<body>
    <div class="container mt-3">

        <section>
            <p>BUTTONS:</p>
        </section>
        <button type="button" class="btn btn-primary">
            Profile: <span class="badge badge-light">4</span>
            <span class="sr-only">unread messages</span>
        </button>
        <a class="btn btn-primary" href="#" role="button">Link</a>
        <button class="btn btn-primary" type="submit">Button</button>

        <hr />

        <label class="btn btn-primary">
            <input type="radio" name="options" id="option3" autocomplete="off" />
        </label>

        <hr />

        <section>
            <form>
                <!-- First Name + Last Name (same row) -->
                <div class="row form-group">
                    <div class="col-sm-5 offset-sm-2">
                        <label for="fname" class="col-form-label">First Name:</label>
                        <input type="text" class="form-control" id="fname" placeholder="Enter first name">
                    </div>
                    <div class="col-sm-5">
                        <label for="lname" class="col-form-label">Last Name:</label>
                        <input type="text" class="form-control" id="lname" placeholder="Enter last name">
                    </div>
                </div>

                <!-- Email -->
                <div class="row form-group">
                    <label for="email" class="col-sm-2 col-form-label">Email:</label>
                    <div class="col-sm-10">
                        <input type="email" class="form-control" id="email" placeholder="Enter email">
                    </div>
                </div>

                <!-- Password -->
                <div class="row form-group">
                    <label for="pwd" class="col-sm-2 col-form-label">Password:</label>
                    <div class="col-sm-10">
                        <input type="password" class="form-control" id="pwd" placeholder="Enter password">
                    </div>
                </div>

                <!-- Readonly -->
                <div class="row form-group">
                    <div class="col-sm-10 offset-sm-2">
                        <input type="text" class="form-control" placeholder="Readonly" readonly>
                    </div>
                </div>

                <!-- Remember me -->
                <div class="row form-group">
                    <div class="col-sm-10 offset-sm-2">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember">
                            <label class="form-check-label" for="remember">Remember me</label>
                        </div>
                    </div>
                </div>

                <!-- Submit -->
                <div class="row form-group">
                    <div class="col-sm-10 offset-sm-2">
                        <button type="submit" class="btn btn-primary">Submit</button>
                    </div>
                </div>
            </form>
        </section>

        <hr />

        <section>
            <p>BADGES:</p>
        </section>
        <span class="badge badge-success">Success</span>
        <span class="badge badge-danger">Danger</span>
        <span class="badge badge-dark">Dark</span>
        <p></p>
        <span class="badge badge-pill badge-info">Info</span>
        <span class="badge badge-pill badge-warning">Warning</span>
        <span class="badge badge-pill badge-secondary">Secondary</span>

        <h1 class="text-primary mt-4">Example Form</h1>
        <p>
            Designed by:
            <a href="https://www.linkedin.com/in/ahmed-alqahtani-a3982696/" target="_blank">Vertex</a>
        </p>
        <p>button: <button class="btn btn-primary">Click Me</button></p>

    </div>
</body>
</html>
